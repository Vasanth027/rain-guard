name: Update IMD RMC data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'imd-data.json'

permissions:
  contents: write

jobs:
  update-imd-rmc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official IMD/RMC feeds
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import datetime
          import xml.etree.ElementTree as ET

          API = 'https://mausam.imd.gov.in/api/'
          RSS = 'https://mausam.imd.gov.in/imd_latest/contents/dist_nowcast_rss.php'

          out = {
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source': 'official IMD/RMC',
              'current': None,
              'nowcast': None,
              'warning': None,
              'rss': None,
              'status': {}
          }

          def get_json(key, url):
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'RainGuard/1.0 (+https://github.com/Vasanth027/rain-guard)',
                      'Accept': 'application/json,text/plain,*/*'
                  })
                  with urllib.request.urlopen(req, timeout=25) as r:
                      payload = json.loads(r.read().decode('utf-8-sig'))
                  out[key] = payload
                  out['status'][key] = 'ok'
              except Exception as exc:
                  out[key] = {'error': str(exc)}
                  out['status'][key] = 'unavailable'

          # IMD documents these as the official APIs. Current weather may require
          # IMD IP whitelisting, so an unavailable API is retained as an explicit
          # status rather than being presented as a successful live feed.
          get_json('current', API + 'current_wx_api.php')
          get_json('nowcast', API + 'nowcast_district_api.php')
          get_json('warning', API + 'warnings_district_api.php')

          # Public official RSS is used as a fallback for district nowcast/warning
          # information when the JSON APIs reject GitHub Actions IPs.
          try:
              req = urllib.request.Request(RSS, headers={
                  'User-Agent': 'RainGuard/1.0 (+https://github.com/Vasanth027/rain-guard)',
                  'Accept': 'application/rss+xml,application/xml,text/xml,*/*'
              })
              with urllib.request.urlopen(req, timeout=25) as r:
                  xml_bytes = r.read()
              root = ET.fromstring(xml_bytes)
              items = []
              for item in root.iter():
                  if item.tag.lower().split('}')[-1] != 'item':
                      continue
                  row = {}
                  for child in item:
                      key = child.tag.lower().split('}')[-1]
                      text = ''.join(child.itertext()).strip()
                      if text:
                          row[key] = text
                  if row:
                      items.append(row)
              out['rss'] = items
              out['status']['rss'] = 'ok'

              # Only use RSS as a fallback when the JSON feed is unavailable.
              if out['status'].get('nowcast') != 'ok' and items:
                  out['nowcast'] = items
                  out['status']['nowcast'] = 'rss-fallback'
              if out['status'].get('warning') != 'ok' and items:
                  out['warning'] = items
                  out['status']['warning'] = 'rss-fallback'
          except Exception as exc:
              out['status']['rss'] = 'unavailable'
              out['rss'] = {'error': str(exc)}

          with open('imd-data.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PY

      - name: Validate snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('imd-data.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('updated_at'), 'updated_at missing'
          assert data.get('source') == 'official IMD/RMC', 'source missing'
          assert isinstance(data.get('status'), dict), 'status missing'
          print('IMD/RMC snapshot status:', json.dumps(data['status'], indent=2))
          PY

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imd-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update official IMD RMC data'
          git push
