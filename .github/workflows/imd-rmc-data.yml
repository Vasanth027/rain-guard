name: Update IMD RMC data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-imd-rmc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official IMD/RMC feeds
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, datetime

          urls = {
              'current': 'https://mausam.imd.gov.in/api/current_wx_api.php',
              'nowcast': 'https://mausam.imd.gov.in/api/nowcast_district_api.php',
              'warning': 'https://mausam.imd.gov.in/api/warnings_district_api.php'
          }

          out = {
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source': 'official IMD/RMC',
              'current': None,
              'nowcast': None,
              'warning': None
          }

          for key, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'RainGuard/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      out[key] = json.loads(r.read().decode('utf-8'))
              except Exception as exc:
                  out[key] = {'error': str(exc)}

          with open('imd-data.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imd-data.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update official IMD RMC data'
          git push
