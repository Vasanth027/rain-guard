name: RainGuard CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'imd-data.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -e
          for file in index.html styles.css weather-v2.css app-v2.js imd.css imd-live.js imd-data.json windy-ui.js windy-ui.css windy-ui-fix.css; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          python3 -m json.tool imd-data.json >/dev/null
          echo "RainGuard files and IMD snapshot are valid."

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in app.js app-v2.js app-rainfix.js alerts.js imd-live.js windy-ui.js; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              node --check "$file"
            fi
          done

      - name: Pages smoke test
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/rainguard-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "RainGuard"
          echo "RainGuard Pages smoke test passed."