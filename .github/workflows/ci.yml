name: RainGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build --tag rain-guard:test .

      - name: Run container
        run: docker run --detach --name rain-guard-test --publish 8080:80 rain-guard:test

      - name: Smoke test
        run: curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "RainGuard"

      - name: Cleanup
        if: always()
        run: docker rm --force rain-guard-test || true
