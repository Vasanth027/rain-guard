name: RainGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build --tag rain-guard:test .

      - name: Validate Nginx configuration
        run: docker run --rm rain-guard:test nginx -t

      - name: Run container
        run: docker run --detach --name rain-guard-test --publish 8080:80 rain-guard:test

      - name: Smoke test
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "RainGuard"; then
              echo "RainGuard smoke test passed."
              exit 0
            fi
            echo "Waiting for Nginx container (attempt ${attempt}/10)..."
            sleep 2
          done
          echo "Container status:"
          docker ps -a --filter name=rain-guard-test
          echo "Container logs:"
          docker logs rain-guard-test || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm --force rain-guard-test || true
