<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RainGuard - a lightweight rain monitoring and alert application.">
  <meta name="theme-color" content="#102033">
  <link rel="manifest" href="manifest.webmanifest">
  <title>RainGuard | Rain Alert</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="weather-v2.css">
  <link rel="stylesheet" href="imd.css">
  <link rel="stylesheet" href="windy-ui.css">
  <link rel="stylesheet" href="windy-ui-fix.css">
</head>
<body>
  <main class="container">
    <header class="hero"><div><p class="eyebrow">WEATHER ALERTS</p><h1>🌧️ RainGuard</h1><p class="subtitle">Know when rain is likely before you step out.</p></div><button type="button" id="locationBtn" class="primary">Use my location</button></header>
    <section class="search card"><label for="cityInput">Search a city</label><div class="search-row"><input id="cityInput" type="text" placeholder="e.g. Chennai" autocomplete="off"><button type="button" id="searchBtn">Search</button></div><p id="status" class="status" role="status">Search for a city or use your location.</p></section>
    <section id="dashboard" class="dashboard hidden" aria-live="polite"></section>
    <footer></footer>
  </main>
  <script src="app-v2.js"></script>
  <script src="imd-live.js"></script>
  <script src="windy-ui-v5.js?v=5"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
</body>
</html>
